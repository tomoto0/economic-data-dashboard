name: Update Economic Data Dashboard

on:
  schedule:
    # 毎日15:00 JST (06:00 UTC) に実行
    - cron: '0 6 * * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests plotly beautifulsoup4 lxml google-generativeai
    
    - name: Fetch latest economic data
      run: |
        python scripts/fetch_data.py
    
    - name: Update dashboard
      run: |
        python scripts/update_dashboard.py
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update economic data - $(date +'%Y-%m-%d %H:%M:%S JST')"
          git push
        fi
    
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs
        publish_branch: gh-pages
        force_orphan: true

