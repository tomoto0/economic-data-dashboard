name: Update Data and Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 毎日15:00 JST (06:00 UTC) に実行
    - cron: '0 6 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests plotly beautifulsoup4 lxml google-generativeai
    
    - name: Fetch latest economic data
      run: |
        python scripts/fetch_data.py
    
    - name: Update dashboard
      run: |
        python scripts/update_dashboard.py
    
    - name: Copy files to root for GitHub Pages
      run: |
        cp docs/modern-dashboard-simple.html ./modern-dashboard-simple.html
        cp docs/index.html ./index.html
    
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto-update economic data - $(date +'%Y-%m-%d %H:%M:%S JST')"
          git push
        fi
    
    - name: Setup Pages
      uses: actions/configure-pages@v5
    
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: '.'
    
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4

