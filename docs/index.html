<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>経済データダッシュボード</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .chart-container {
            border: 1px solid #ddd;
            border-radius: 5px;
            overflow: hidden;
        }
        .chart-container iframe {
            width: 100%;
            height: 400px;
            border: none;
        }
        .chart-title {
            background-color: #f8f9fa;
            padding: 10px;
            font-weight: bold;
            text-align: center;
            border-bottom: 1px solid #ddd;
        }
        .last-updated {
            text-align: center;
            color: #666;
            margin-top: 20px;
            font-size: 0.9em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>経済データダッシュボード</h1>
        
        <div class="chart-grid">
            <div class="chart-container">
                <div class="chart-title">GDP推移</div>
                <iframe src="gdp_over_time.html"></iframe>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">人口推移</div>
                <iframe src="population_over_time.html"></iframe>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">失業率推移</div>
                <iframe src="unemployment_trend.html"></iframe>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">外貨準備高推移</div>
                <iframe src="reserves_trend.html"></iframe>
            </div>
            
            <div class="chart-container">
                <div class="chart-title">GDP vs 人口</div>
                <iframe src="gdp_vs_population.html"></iframe>
            </div>
        </div>
        
        <div class="last-updated">
            最終更新: <span id="lastUpdated"></span>
        </div>
    </div>

    <script>
        // 現在の日時を表示
        document.getElementById('lastUpdated').textContent = new Date().toLocaleString('ja-JP');
    </script>
</body>
</html>
